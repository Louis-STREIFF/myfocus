services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony-php-isa
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
    environment:
      # Adapter si besoin
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "mysql://symfony:symfony@symfony-mysql-louis:3306/symfony?charset=utf8mb4"
    networks:
      - default
   
